# The whole bootstrap: one Discovery that says WHERE (inline source) and WHAT (the RGD resource), and one
# NamespacedDeployer that says HOW (apply it). No Repository, Component or Resource is written by hand; the
# Discovery generates the Repository and Component from its source.
apiVersion: delivery.ocm.software/v1alpha1
kind: Discovery
metadata:
  name: discovery-bootstrap
spec:
  source:
    repositorySpec:
      # Adjust to your OCM repository
      baseUrl: http://ocm-e2e-image-registry:5000
      type: OCIRegistry
    component: ocm.software/ocm-k8s-toolkit/examples/discovery-bootstrap
    semver: 1.0.0
    interval: 10m
  # The Deployer applies every selected resource, so select only the RGD.
  resourceSelector:
    matchIdentity:
      name: kro-rgd
  ocmConfig:
    # Signature verification key of the umbrella component.
    - apiVersion: v1
      kind: Secret
      name: discovery-bootstrap-ocmconfig
    # Allows plain HTTP to the registry above (created by test/e2e/hacks/setup.sh).
    - kind: ConfigMap
      name: ocm-plain-http
---
apiVersion: delivery.ocm.software/v1alpha1
kind: NamespacedDeployer
metadata:
  name: discovery-bootstrap
spec:
  discoveryRef:
    name: discovery-bootstrap
  serviceAccountName: discovery-bootstrap-deployer
---
# The NamespacedDeployer applies the cluster-scoped ResourceGraphDefinition with the permissions of this
# service account, so it needs a ClusterRole for ResourceGraphDefinitions.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: discovery-bootstrap-deployer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: discovery-bootstrap-deployer
rules:
  - apiGroups: ["kro.run"]
    resources: ["resourcegraphdefinitions"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: discovery-bootstrap-deployer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: discovery-bootstrap-deployer
subjects:
  - kind: ServiceAccount
    name: discovery-bootstrap-deployer
    namespace: default
