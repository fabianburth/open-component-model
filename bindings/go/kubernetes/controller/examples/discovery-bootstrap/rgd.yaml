# Shipped inside the umbrella component as resource kro-rgd and applied by the bootstrap NamespacedDeployer.
# It discovers the charts and images of the same, already verified component version and deploys one Flux
# OCIRepository + HelmRelease per chart, with the image of the same child component. Every reference comes from
# the Discovery's status.resources, so charts and images are pulled by the digest the Discovery verified.
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: discovery-bootstrap
spec:
  schema:
    apiVersion: v1alpha1
    kind: DiscoveryBootstrap
    spec:
      # The Component generated by the bootstrap Discovery (<discovery>-component). Reusing it keeps the
      # application on exactly the version, and the verified digest, the bootstrap discovered.
      component: string | default="discovery-bootstrap-component"
  resources:
    - id: payload
      # Without readyWhen kro treats the Discovery as ready once it exists and would render an empty
      # collection from a not yet discovered status.
      readyWhen:
        - ${payload.status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')}
      template:
        apiVersion: delivery.ocm.software/v1alpha1
        kind: Discovery
        metadata:
          name: ${schema.metadata.name + '-payload'}
        spec:
          componentRef:
            name: ${schema.spec.component}
          # The selector binds identity and labels, not the type: select by name, split by type below.
          resourceSelector:
            expression: identity.name in ["chart", "image"]
    # One OCIRepository per chart. Pinned references have the form [scheme://]host/repo:tag@sha256:...
    - id: sources
      forEach:
        - chart: ${payload.status.resources.filter(e, e.resource.type == 'helmChart')}
      template:
        apiVersion: source.toolkit.fluxcd.io/v1
        kind: OCIRepository
        metadata:
          name: >-
            ${schema.metadata.name + '-' + chart.component.component.substring(chart.component.component.lastIndexOf('/') + 1)}
        spec:
          interval: 1m0s
          insecure: true
          layerSelector:
            mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
            operation: copy
          url: >-
            ${cel.bind(r, string(chart.resource.access.imageReference).replace('http://', '').split('@')[0],
            'oci://' + r.substring(0, r.lastIndexOf(':')))}
          ref:
            digest: ${string(chart.resource.access.imageReference).split('@')[1]}
    # One HelmRelease per chart, localized to the image of the same child component, pinned by digest.
    - id: releases
      forEach:
        - chart: ${payload.status.resources.filter(e, e.resource.type == 'helmChart')}
      readyWhen:
        - ${each.status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')}
      template:
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: >-
            ${schema.metadata.name + '-' + chart.component.component.substring(chart.component.component.lastIndexOf('/') + 1)}
        spec:
          releaseName: >-
            ${schema.metadata.name + '-' + chart.component.component.substring(chart.component.component.lastIndexOf('/') + 1)}
          interval: 1m
          timeout: 5m
          chartRef:
            kind: OCIRepository
            name: >-
              ${schema.metadata.name + '-' + chart.component.component.substring(chart.component.component.lastIndexOf('/') + 1)}
            namespace: ${schema.metadata.namespace}
          values:
            image:
              # repository: host/repo, tag: <tag>@sha256:... (podinfo renders repository:tag)
              repository: >-
                ${cel.bind(r, string(payload.status.resources.filter(i, i.resource.type == 'ociImage'
                && i.component.component == chart.component.component)[0].resource.access.imageReference).replace('http://', ''),
                r.substring(0, r.split('@')[0].lastIndexOf(':')))}
              tag: >-
                ${cel.bind(r, string(payload.status.resources.filter(i, i.resource.type == 'ociImage'
                && i.component.component == chart.component.component)[0].resource.access.imageReference),
                r.substring(r.split('@')[0].lastIndexOf(':') + 1))}
